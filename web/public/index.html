<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>SFU test</title>
</head>

<body>
  <h2>SFU skeleton test</h2>
  <div id="log" style="font-family: monospace; white-space: pre-wrap;"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(...args) {
      console.log(...args);
      logEl.textContent += args.join(' ') + '\n';
    }

    const ws = new WebSocket(`ws://${location.host}/ws`);
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
    });

    pc.onconnectionstatechange = () => log('connection state:', pc.connectionState);
    pc.oniceconnectionstatechange = () => log('ice state:', pc.iceConnectionState);

    ws.onmessage = async (msg) => {
      const m = JSON.parse(msg.data);
      log('received event:', m.event);
      if (m.event === 'answer') {
        await pc.setRemoteDescription(m.data);
        log('set remote answer');
      } else if (m.event === 'candidate') {
        try {
          await pc.addIceCandidate(m.data);
        } catch (err) {
          log('addIceCandidate error', err);
        }
      }
    };
    pc.onicecandidate = (e) => {
      if (e.candidate) {
        ws.send(JSON.stringify({ event: 'candidate', data: e.candidate.toJSON() }));
      }
    };

    ws.onopen = async () => {
      log('ws open, requesting camera...');

      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      stream.getTracks().forEach((t) => pc.addTrack(t, stream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ event: 'offer', data: pc.localDescription }));
      log('sent offer');
    };
  </script>
</body>

</html>
